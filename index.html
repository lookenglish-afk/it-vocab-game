<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Head Tilt IT Vocab Game - Nghiêng Đầu Chọn Đáp Án</title>
  <!-- Thư viện MediaPipe Face Mesh & Camera phát hiện chuyển động mặt -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Times New Roman", Times, serif;
      background: #020617;
      color: #f8fafc;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* THANH TRÊN CÙNG: Điểm & Câu hỏi */
    .top-bar {
      height: 80px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 40px;
      background: #0f172a;
      border-bottom: 2px solid #38bdf8;
      z-index: 10;
    }
    .score-badge {
      font-size: 28px;
      font-weight: bold;
      color: #38bdf8;
      background: #1e293b;
      padding: 8px 20px;
      border-radius: 12px;
      border: 1px solid #0284c7;
    }
    .status-text {
      font-size: 26px;
      color: #facc15;
      font-weight: bold;
    }

    /* ĐỊNH NGHĨA / CÂU HỎI */
    .question-banner {
      background: #1e293b;
      text-align: center;
      padding: 14px 20px;
      font-size: 28px;
      color: #ffffff;
      border-bottom: 2px solid #334155;
      z-index: 10;
    }
    .question-banner span {
      color: #38bdf8;
      font-weight: bold;
    }

    /* KHU VỰC CHÍNH */
    .arena {
      flex: 1;
      display: flex;
      position: relative;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
    }

    /* 2 HỘP TỪ VỰNG TRÁI / PHẢI */
    .choice-box {
      width: 28%;
      height: 70%;
      background: rgba(15, 23, 42, 0.9);
      border: 4px solid #334155;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
      transition: all 0.2s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .choice-tag {
      position: absolute;
      top: 15px;
      font-size: 22px;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 20px;
      background: #334155;
      color: #e2e8f0;
    }
    .choice-text {
      font-size: 38px;
      font-weight: bold;
      color: #ffffff;
      margin-top: 10px;
      word-break: break-word;
    }
    /* Thanh nạp thời gian khi nghiêng đầu */
    .progress-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 14px;
      width: 0%;
      background: #38bdf
