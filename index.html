<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>IT Vocabulary Interactive Arena - 25 Tech Terms</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Times New Roman", Times, serif;
      background: radial-gradient(circle at center, #0b192c 0%, #030712 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
    }
    .container {
      width: 100%;
      max-width: 950px;
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #0284c7;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 0 35px rgba(2, 132, 199, 0.35);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #334155;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    .title {
      font-size: 28px;
      font-weight: bold;
      color: #38bdf8;
      letter-spacing: 1px;
    }
    .scoreboard {
      display: flex;
      gap: 20px;
      font-size: 22px;
    }
    .team-box {
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
    }
    .team-blue { background: #0369a1; border: 1px solid #38bdf8; }
    .team-red { background: #991b1b; border: 1px solid #f87171; }
    .progress-bar {
      width: 100%;
      height: 10px;
      background: #1e293b;
      border-radius: 5px;
      margin-bottom: 24px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 4%;
      background: #38bdf8;
      transition: width 0.3s ease;
    }
    .question-card {
      background: #1e293b;
      border-left: 6px solid #38bdf8;
      padding: 24px;
      border-radius: 8px;
      margin-bottom: 24px;
      text-align: center;
    }
    .clue-label {
      font-size: 20px;
      color: #94a3b8;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .clue-text {
      font-size: 32px;
      font-weight: bold;
      color: #f8fafc;
      line-height: 1.4;
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }
    .opt-btn {
      font-family: "Times New Roman", Times, serif;
      font-size: 24px;
      font-weight: bold;
      padding: 18px 20px;
      background: #0f172a;
      color: #e2e8f0;
      border: 2px solid #334155;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }
    .opt-btn:hover {
      background: #1e293b;
      border-color: #38bdf8;
      transform: translateY(-2px);
    }
    .opt-btn.correct {
      background: #166534 !important;
      border-color: #22c55e !important;
      color: #ffffff !important;
    }
    .opt-btn.wrong {
      background: #991b1b !important;
      border-color: #ef4444 !important;
      color: #ffffff !important;
    }
    .footer-ctrl {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .award-btn {
      font-family: "Times New Roman", Times, serif;
      font-size: 20px;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      border: none;
      font-weight: bold;
      color: white;
    }
    .btn-blue { background: #0284c7; }
    .btn-red { background: #dc2626; }
    .next-btn {
      font-family: "Times New Roman", Times, serif;
      font-size: 22px;
      font-weight: bold;
      padding: 10px 24px;
      background: #22c55e;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="title">⚡ 25 VOCABULARY ARENA ⚡</div>
    <div class="scoreboard">
      <div class="team-box team-blue" id="score-team1">Team Binary: 0</div>
      <div class="team-box team-red" id="score-team2">Team Logic: 0</div>
    </div>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="progress"></div>
  </div>

  <div class="question-card">
    <div class="clue-label" id="q-counter">Thuật ngữ 1 / 25</div>
    <div class="clue-text" id="clue">Đang tải câu hỏi...</div>
  </div>

  <div class="options-grid" id="options"></div>

  <div class="footer-ctrl">
    <div>
      <span style="font-size: 20px; margin-right: 8px; color: #94a3b8;">Cộng điểm cho:</span>
      <button class="award-btn btn-blue" onclick="addScore(1)">+100 Team Binary</button>
      <button class="award-btn btn-red" onclick="addScore(2)">+100 Team Logic</button>
    </div>
    <button class="next-btn" id="btn-next" onclick="nextQuestion()">Câu kế tiếp ➔</button>
  </div>
</div>

<script>
  // 25 từ vựng đúng theo danh mục giáo trình
  const vocabData = [
    { word: "Science", meaning: "Khoa học", def: "A systematic enterprise that builds and organizes knowledge" },
    { word: "Interchangeably", meaning: "Có thể thay thế cho nhau", def: "In a way that can be exchanged or substituted" },
    { word: "Order", meaning: "Trật tự / Thứ tự", def: "The arrangement or sequence of things in relation to each other" },
    { word: "Retrieve", meaning: "Lấy, gọi ra", def: "To get or bring information back from computer memory" },
    { word: "Control unit", meaning: "Đơn vị điều khiển", def: "Examines instructions and directs operations inside the CPU" },
    { word: "Arithmetic-logical unit", meaning: "Đơn vị số học - logic", def: "Performs mathematical calculations (+, -) and logical tests" },
    { word: "State", meaning: "Trạng thái", def: "The particular condition that something is in (e.g., ON or OFF)" },
    { word: "Transmit", meaning: "Truyền", def: "To broadcast, send or pass electrical signals from one place to another" },
    { word: "Signal", meaning: "Tín hiệu", def: "An electrical impulse or radio wave transmitted through a circuit" },
    { word: "Command", meaning: "Mệnh lệnh", def: "An instruction given to a computer program or hardware" },
    { word: "Interpret", meaning: "Dịch / Diễn giải", def: "To translate or explain the meaning of program instructions" },
    { word: "Load", meaning: "Tải", def: "To transfer data or programs from secondary storage into main memory" },
    { word: "Console", meaning: "Thiết bị đầu cuối", def: "A panel or screen containing controls to operate computer equipment" },
    { word: "Manual", meaning: "Bằng tay / Thủ công", def: "Done with the hands rather than automatically by a machine" },
    { word: "Automatic", meaning: "Tự động", def: "Working by itself with little or no direct human control" },
    { word: "Connected", meaning: "Kết nối", def: "Joined or linked together by electronic switches or cables" },
    { word: "Current", meaning: "Dòng điện", def: "A flow of electricity flowing through a wire or circuit" },
    { word: "Binary digit", meaning: "Số nhị phân (Bit)", def: "The smallest unit of data in computing: either 0 or 1" },
    { word: "Grouped", meaning: "Nhóm / Gom cụm", def: "Gathered or classified together (e.g. 8 bits grouped into 1 byte)" },
    { word: "Arrangement", meaning: "Sắp xếp / Bố trí", def: "A specific layout or pattern of bits representing a character" },
    { word: "Representation", meaning: "Hiển thị lại / Biểu diễn", def: "The way information is coded or depicted in digital form" },
    { word: "Reserved", meaning: "Cất giữ / Dành riêng", def: "Kept specially for a particular purpose (e.g., first 32 ASCII codes)" },
    { word: "Codes", meaning: "Mã", def: "A standard system of words, letters, or figures for communication" },
    { word: "RAM memory", meaning: "Bộ nhớ RAM", def: "Temporary random-access memory where running programs are stored" },
    { word: "Document", meaning: "Tài liệu", def: "A file created by an application containing text, data or graphics" }
  ];

  let currentIdx = 0;
  let scoreTeam1 = 0;
  let scoreTeam2 = 0;
  let answered = false;

  function loadQuestion() {
    answered = false;
    document.getElementById("btn-next").style.display = "none";
    const item = vocabData[currentIdx];
    
    document.getElementById("q-counter").innerText = `Câu hỏi ${currentIdx + 1} / ${vocabData.length}`;
    document.getElementById("clue").innerHTML = `"${item.meaning}"<br><span style="font-size:22px; color:#94a3b8; font-weight:normal;">(${item.def})</span>`;
    document.getElementById("progress").style.width = `${((currentIdx + 1) / vocabData.length) * 100}%`;

    // Sinh 4 phương án (1 đúng + 3 nhiễu)
    let options = [item.word];
    while (options.length < 4) {
      let rand = vocabData[Math.floor(Math.random() * vocabData.length)].word;
      if (!options.includes(rand)) options.push(rand);
    }
    options.sort(() => Math.random() - 0.5);

    const optContainer = document.getElementById("options");
    optContainer.innerHTML = "";
    options.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "opt-btn";
      btn.innerText = opt;
      btn.onclick = () => checkAnswer(btn, opt, item.word);
      optContainer.appendChild(btn);
    });
  }

  function checkAnswer(selectedBtn, selectedText, correctWord) {
    if (answered) return;
    answered = true;

    const allButtons = document.querySelectorAll(".opt-btn");
    allButtons.forEach(btn => {
      if (btn.innerText === correctWord) {
        btn.classList.add("correct");
      }
    });

    if (selectedText !== correctWord) {
      selectedBtn.classList.add("wrong");
    }

    document.getElementById("btn-next").style.display = "block";
  }

  function addScore(team) {
    if (team === 1) {
      scoreTeam1 += 100;
      document.getElementById("score-team1").innerText = `Team Binary: ${scoreTeam1}`;
    } else {
      scoreTeam2 += 100;
      document.getElementById("score-team2").innerText = `Team Logic: ${scoreTeam2}`;
    }
  }

  function nextQuestion() {
    currentIdx++;
    if (currentIdx < vocabData.length) {
      loadQuestion();
    } else {
      let winner = scoreTeam1 > scoreTeam2 ? "TEAM BINARY CHIẾN THẮNG! 🏆" : (scoreTeam2 > scoreTeam1 ? "TEAM LOGIC CHIẾN THẮNG! 🏆" : "HAI ĐỘI HÒA NHAU! 🤝");
      document.querySelector(".container").innerHTML = `
        <div style="text-align: center; padding: 40px;">
          <h1 style="color: #38bdf8; font-size: 42px; margin-bottom: 20px;">KẾT THÚC VÒNG ĐẤU</h1>
          <h2 style="color: #22c55e; font-size: 36px; margin-bottom: 30px;">${winner}</h2>
          <p style="font-size: 26px;">Team Binary: ${scoreTeam1} pts | Team Logic: ${scoreTeam2} pts</p>
          <button onclick="location.reload()" style="font-family:'Times New Roman'; margin-top:30px; padding:12px 30px; font-size:24px; background:#0284c7; color:white; border:none; border-radius:8px; cursor:pointer;">Chơi lại</button>
        </div>
      `;
    }
  }

  loadQuestion();
</script>
</body>
</html>
